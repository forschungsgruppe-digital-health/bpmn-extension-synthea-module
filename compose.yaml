# `docker compose up` builds the image and serves the modeler on http://localhost:5173/modeler/
#
# Convert a model to Synthea modules with the converter in the same image:
#   docker compose run --rm app npm run bpmn2gmf -- examples/lung-cancer --out-dir out/modules
#
# Generate a FHIR test data set into ./out (the Synthea jar is downloaded once and cached in a volume):
#   docker compose run --rm testdata
#   docker compose run --rm testdata /out --population 1000 --seed 3
services:
  app:
    build: .
    ports:
      - "5173:5173"
    volumes:
      # Edit files on the host and see them in the modeler (hot reload).
      - .:/app
      # Keep the installed dependencies of the image.
      - /app/node_modules
      - /app/demo/node_modules

  # Not started by `docker compose up` (profile); run it with `docker compose run --rm testdata`.
  testdata:
    build: .
    profiles: ["tools"]
    entrypoint: ["scripts/generate-testdata.sh"]
    command: ["/out"]
    environment:
      SYNTHEA_CACHE_DIR: /cache
    volumes:
      - ./out:/out
      - synthea-cache:/cache

volumes:
  synthea-cache:
