name: deploy-pages

# Publishes the state of the dev branch on GitHub Pages: the overview and guides at the root, the
# modeler under modeler/, the converter result under modules/ (built by tools/build-site.mjs on dev).
#
# Why this file lives on main: the github-pages environment only allows deployments that run from
# main. A workflow_run workflow always runs from the default branch (main), so this one may deploy,
# and it checks out exactly the dev commit that the validate workflow has just passed. It starts by
# itself after every green validate run on dev, and by hand ("Run workflow", then it takes the tip
# of dev).

on:
  workflow_run:
    workflows: [validate]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

# Least-privilege token scopes required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # only after a green validate run of a push to dev (not of a pull request), or by hand
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'dev' }}

      - name: Name the checked-out commit dev
        # the result page records the branch it was built from; a checked-out SHA has none, and
        # GITHUB_REF_NAME would say main
        run: git checkout -B dev

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies (workspaces incl. demo)
        run: npm ci --no-audit --no-fund

      - name: Build the site (overview and guides, modeler, converter result) and check it
        # Project Pages serve from /<repo>/, so every asset must be requested from that sub-path; the
        # check fails the job on a wrong path, a missing page, a dead link or a conversion error.
        run: node tools/build-site.mjs /${{ github.event.repository.name }}/ site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
