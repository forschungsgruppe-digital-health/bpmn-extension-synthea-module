name: pages-build

# Builds the whole GitHub Pages site (docs-site/ guides at the root, the demo/ modeler at /modeler/,
# the converter result at /modules/) and checks it, on every push to dev and every pull request.
#
# It does not deploy. The github-pages environment only allows deployments that run from main, so
# the deploy is the workflow .github/workflows/pages.yml on main ("deploy-pages"): it starts after
# every green validate run on dev, checks out that dev commit and runs the same tools/build-site.mjs.

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies (workspaces incl. demo)
        run: npm ci --no-audit --no-fund

      - name: Build the site (overview and guides, modeler, converter result) and check it
        # Project Pages serve from /<repo>/, so every asset must be requested from that sub-path; the
        # check fails the job on a wrong path, a missing page, a dead link or a conversion error.
        run: node tools/build-site.mjs /${{ github.event.repository.name }}/ site
