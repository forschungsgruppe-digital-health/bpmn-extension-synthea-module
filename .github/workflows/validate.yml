name: validate

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      # One list of checks: package.json, script "validate". Do not repeat its steps here.
      - name: Validate (npm run validate)
        run: npm run validate

      # Not part of "validate": the files in examples/invalid/ must keep failing.
      - name: Lint invalid examples (negative test, must fail)
        run: |
          if npm run lint:invalid; then
            echo "::error::invalid examples unexpectedly passed lint — a rule is not firing"
            exit 1
          else
            echo "invalid examples correctly rejected"
          fi
