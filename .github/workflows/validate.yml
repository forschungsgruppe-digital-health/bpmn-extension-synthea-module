name: validate

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      # One list of checks: package.json, script "validate". Do not repeat its steps here.
      - name: Validate (npm run validate)
        run: npm run validate

      # Not part of "validate": the files in examples/invalid/ must keep failing.
      - name: Lint invalid examples (negative test, must fail)
        run: |
          if npm run lint:invalid; then
            echo "::error::invalid examples unexpectedly passed lint — a rule is not firing"
            exit 1
          else
            echo "invalid examples correctly rejected"
          fi

  # Installability: pack the package, install it into examples/consumer, build, run the converter bin.
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Pack, install into the consumer example, build (npm run test:consumer)
        run: npm run test:consumer

  # The Docker setup: the image builds and serves the modeler.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and start (docker compose up)
        run: docker compose up --build --detach

      - name: Wait for the modeler on port 5173
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5173/ | grep -q "BPMN Extension Demo"; then
              echo "modeler is up"
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          echo "::error::modeler did not come up on port 5173"
          exit 1

      - name: Converter is in the image
        run: docker compose exec -T app npm run convert:check

      - name: Stop
        if: always()
        run: docker compose down
