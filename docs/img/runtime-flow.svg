<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="820" height="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How a .bpmn file is loaded, edited and saved, and which tool checks which stage</title>
  <desc id="d">The .bpmn file on disk is turned into in-memory JS objects by fromXML and back by toXML. The bpmn-js editor renders and edits the objects. xmllint with BPMN20.xsd checks the core structure of the file. The round-trip tool and bpmnlint with your plugin check the in-memory objects.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a7fd0"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b7791f"/></marker>
  </defs>

  <!-- data flow -->
  <g fill="#eef3fb" stroke="#27478c" stroke-width="2">
    <rect x="20" y="30" width="180" height="76" rx="10"/>
    <rect x="340" y="30" width="180" height="76" rx="10"/>
    <rect x="660" y="30" width="140" height="76" rx="10"/>
  </g>
  <g fill="#16284d" text-anchor="middle">
    <text x="110" y="64" font-size="16" font-weight="700">.bpmn file</text>
    <text x="110" y="86" font-size="13">XML on disk</text>
    <text x="430" y="64" font-size="16" font-weight="700">In-memory model</text>
    <text x="430" y="86" font-size="13">JS objects</text>
    <text x="730" y="64" font-size="16" font-weight="700">bpmn-js</text>
    <text x="730" y="86" font-size="13">editor / viewer</text>
  </g>
  <g stroke="#4a7fd0" stroke-width="2" fill="none">
    <path d="M200 52H338" marker-end="url(#a)"/>
    <path d="M338 84H202" marker-end="url(#a)"/>
    <path d="M522 68H658" marker-start="url(#a)" marker-end="url(#a)"/>
  </g>
  <g fill="#4a7fd0" font-size="12" text-anchor="middle" font-weight="600">
    <text x="270" y="44">fromXML</text>
    <text x="270" y="102">toXML</text>
    <text x="590" y="58">render / edit</text>
  </g>

  <!-- checkers -->
  <g fill="#fff7e6" stroke="#b7791f" stroke-width="2">
    <rect x="20" y="212" width="180" height="76" rx="10"/>
    <rect x="250" y="212" width="180" height="76" rx="10"/>
    <rect x="450" y="212" width="180" height="76" rx="10"/>
  </g>
  <g fill="#5c3d0a" text-anchor="middle">
    <text x="110" y="244" font-size="15" font-weight="700">xmllint + BPMN20.xsd</text>
    <text x="110" y="267" font-size="12.5">checks the core structure</text>
    <text x="340" y="244" font-size="15" font-weight="700">round-trip tool</text>
    <text x="340" y="267" font-size="12.5">your data parses + serialises</text>
    <text x="540" y="244" font-size="15" font-weight="700">bpmnlint + your plugin</text>
    <text x="540" y="267" font-size="12.5">checks your data's semantics</text>
  </g>
  <g stroke="#b7791f" stroke-width="2" stroke-dasharray="6 5" fill="none">
    <path d="M110 212V108" marker-end="url(#c)"/>
    <path d="M345 212L395 108" marker-end="url(#c)"/>
    <path d="M535 212L470 108" marker-end="url(#c)"/>
  </g>
</svg>
