<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BPMN Extension Demo — synthea</title>
  </head>
  <body>
    <header class="toolbar">
      <strong>synthea</strong>
      <span class="hint">Select an element → edit its <code>synthea:</code> properties groups (e.g. <code>State type</code>, <code>Encounter Context</code>) → Download to see the XML.</span>
      <span class="spacer"></span>
      <label for="pathway-select" class="pathway-label">Pathway</label>
      <select id="pathway-select"></select>
      <button id="load-example" type="button">Reload</button>
      <button id="new-diagram" type="button">New</button>
      <button id="download" type="button">Download .bpmn</button>
    </header>
    <main class="content">
      <div id="canvas"></div>
      <div id="properties"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
